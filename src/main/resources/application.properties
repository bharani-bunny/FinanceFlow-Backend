spring.application.name=financeflow-backend

# Local demo defaults match the financeflow_app account created for this project.
# Override these values with environment variables when your local credentials differ.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/financeflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:financeflow_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Use the Session 2 schema as the source of truth and create missing tables/columns.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Replace this development key with a private random value outside local development.
app.jwt.secret=${JWT_SECRET:financeflow-local-development-secret-key-change-me}

pring.application.name=financeflow-backend

# Local demo defaults match the financeflow_app account created for this project.
# Override these values with environment variables when your local credentials differ.
spring.datasource.url=${b}
spring.datasource.username=${a}
spring.datasource.password=${r}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Use the Session 2 schema as the source of truth and create missing tables/columns.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
